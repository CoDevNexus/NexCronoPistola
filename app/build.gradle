plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// URL del servidor de actualizaciones (carpeta servidor-actualizaciones/ en tu hosting).
// Déjala vacía hasta tenerla: se define en gradle.properties (nexcronoUpdateUrl=...)
// o en GitHub como secreto NEXCRONO_UPDATE_URL. Vacía = la app no busca actualizaciones.
def updateUrl = (project.findProperty('nexcronoUpdateUrl') ?: System.getenv('NEXCRONO_UPDATE_URL') ?: '').toString().trim()

// Firma de release: se activa solo si existen las variables (secretos de GitHub o tu PC).
def ksFile = System.getenv('KEYSTORE_FILE')
def firmaDisponible = ksFile != null && file(ksFile).exists()

android {
    namespace 'com.codevnexus.pistola'
    compileSdk 35

    defaultConfig {
        applicationId "com.codevnexus.pistola"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
        buildConfigField "String", "UPDATE_URL", "\"${updateUrl}\""
    }

    signingConfigs {
        if (firmaDisponible) {
            release {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (firmaDisponible) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
