name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      # Si existe el secreto KEYSTORE_BASE64 se compila el APK firmado con la llave de CodevNexus
      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/codevnexus.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/codevnexus.jks" >> "$GITHUB_ENV"
            echo "TAREA=assembleRelease" >> "$GITHUB_ENV"
            echo "SALIDA=release" >> "$GITHUB_ENV"
          else
            echo "Sin llave: se compila APK de prueba (debug)"
            echo "TAREA=assembleDebug" >> "$GITHUB_ENV"
            echo "SALIDA=debug" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NEXCRONO_UPDATE_URL: ${{ secrets.NEXCRONO_UPDATE_URL }}
        run: gradle $TAREA --no-daemon --stacktrace

      - name: Calcular SHA-256
        run: sha256sum app/build/outputs/apk/$SALIDA/*.apk | tee apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: NexCronoPistola-apk
          path: |
            app/build/outputs/apk/${{ env.SALIDA }}/*.apk
            apk.sha256
